    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      /* Splash Keyframe Animations */
      @keyframes truckDriveIn {
        0% {
          transform: translateX(-150%);
          opacity: 0;
        }
        30% {
          transform: translateX(0);
          opacity: 1;
        }
        85% {
          transform: translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateX(120%);
          opacity: 0;
        }
      }

      @keyframes linkSnapLeft {
        0% {
          transform: translateX(-24px);
          opacity: 0.5;
        }
        40% {
          transform: translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes linkSnapRight {
        0% {
          transform: translateX(24px);
          opacity: 0.5;
        }
        40% {
          transform: translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes textFadeInOut {
        0%, 35% {
          opacity: 0;
          transform: translateY(12px);
        }
        50%, 82% {
          opacity: 1;
          transform: translateY(0);
        }
        95%, 100% {
          opacity: 0;
          transform: translateY(-8px);
        }
      }

      @keyframes splashContainerFade {
        0%, 85% {
          opacity: 1;
          visibility: visible;
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      .splash-screen {
        animation: splashContainerFade 3.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .splash-truck {
        animation: truckDriveIn 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      .splash-link-left {
        animation: linkSnapLeft 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .splash-link-right {
        animation: linkSnapRight 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .splash-text {
        animation: textFadeInOut 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Custom Leaflet Map Tooltip and Popup styling */
      .leaflet-popup-content-wrapper {
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        padding: 4px;
      }
      .dark .leaflet-popup-content-wrapper {
        background-color: #1e293b;
        color: #f1f5f9;
      }
      .dark .leaflet-popup-tip {
        background-color: #1e293b;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
